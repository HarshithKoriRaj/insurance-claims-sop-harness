[project]
name = "insurance-claims-sop"
version = "0.1.0"
description = "SOP harness for an insurance claims support agent"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9,<3",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/api"]
addopts = "-ra --import-mode=importlib"
