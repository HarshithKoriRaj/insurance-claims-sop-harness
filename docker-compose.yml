services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Read from your shell or from .env next to this file. Set one of the two keys.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      APP_MODE: ${APP_MODE:-demo}
      BUSINESS_DATE_OVERRIDE: ${BUSINESS_DATE_OVERRIDE:-}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_FROM: claims-assistant@example.com
    volumes:
      - app-data:/data
    depends_on:
      - mailpit
    restart: unless-stopped

  # Local inbox for the email summaries: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    restart: unless-stopped

volumes:
  app-data:
